<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#eaf0ff;
  --blocker:#b91c1c; --blocker-bg:#fee2e2;
  --major:#b45309;  --major-bg:#fef3c7;
  --minor:#3f6212;  --minor-bg:#ecfccb;
  --add-bg:#e6ffed; --add-mark:#22863a;
  --del-bg:#ffeef0; --del-mark:#b31d28;
  --code:#f3f4f6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171a; --panel:#1c2024; --ink:#e6e8eb; --muted:#9aa1ab; --line:#2c3138;
    --accent:#6ea8ff; --accent-soft:#1c2b46;
    --blocker:#fca5a5; --blocker-bg:#3b1414;
    --major:#fcd34d;  --major-bg:#3a2b08;
    --minor:#bef264;  --minor-bg:#1f2d0b;
    --add-bg:#122b1a; --add-mark:#4ade80;
    --del-bg:#331418; --del-mark:#fca5a5;
    --code:#12151a; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
code,pre,.mono{font-family:"D2Coding",ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
a{color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 80px}

/* ── 헤더 ───────────────────────────────────────── */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 0 14px;margin-bottom:16px}
.hd{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hd h1{margin:0 0 4px;font-size:20px;line-height:1.4}
.hd .sub{color:var(--muted);font-size:13px}
.hd .sub b{color:var(--ink);font-weight:600}
.grow{flex:1 1 320px;min-width:280px}
.verdict{font-size:22px;font-weight:800;letter-spacing:.06em;padding:8px 18px;border-radius:10px;white-space:nowrap}
.verdict.PASS{color:var(--minor);background:var(--minor-bg)}
.verdict.FAIL{color:var(--blocker);background:var(--blocker-bg)}
.progress{font-size:13px;color:var(--muted);margin-top:8px}
.progress b{color:var(--ink);font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ── 필터 ───────────────────────────────────────── */
.filters{position:sticky;top:0;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:18px;display:flex;gap:14px;align-items:center;
  flex-wrap:wrap;box-shadow:var(--shadow)}
.fgroup{display:flex;gap:6px;align-items:center}
.fgroup>span{font-size:12px;color:var(--muted);margin-right:2px}
.filters input[type=search]{flex:1 1 200px;min-width:160px;font:inherit;font-size:13px;padding:6px 10px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}

/* ── 대시보드 ───────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th,table.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{color:var(--muted);font-weight:600;font-size:12px}
table.mini td.n{text-align:right;font-variant-numeric:tabular-nums}
.zero{color:var(--muted)}

/* ── 본문 레이아웃 ──────────────────────────────── */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.layout>main{min-width:0}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.toc{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}
nav.toc .f{margin:10px 0 4px;font-weight:700;word-break:break-all;line-height:1.4}
nav.toc .f:first-child{margin-top:0}
nav.toc a{display:block;padding:2px 0 2px 10px;color:var(--muted);text-decoration:none;
  border-left:2px solid var(--line);line-height:1.45}
nav.toc a:hover{color:var(--accent);border-left-color:var(--accent)}
nav.toc a .uid{color:var(--ink);font-weight:600}

/* ── 파일 / 변경단위 ────────────────────────────── */
section.file{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:20px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.unit,.finding{min-width:0}
.file>h2{margin:0;padding:12px 16px;font-size:15px;background:var(--code);
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;word-break:break-all}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);
  color:var(--accent);white-space:nowrap;letter-spacing:.02em}
.tag.p1{background:var(--major-bg);color:var(--major)}
.unit{border-top:1px solid var(--line);padding:14px 16px}
.unit:first-of-type{border-top:none}
.unit>h3{margin:0 0 10px;font-size:14px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.unit>h3 .uid{font-weight:800;color:var(--accent)}
.unit>h3 .sum{font-weight:500;color:var(--ink)}
.unit>h3 .rng{color:var(--muted);font-size:12px;font-weight:400}

/* ── 코드 ───────────────────────────────────────── */
.code{background:var(--code);border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin:0 0 12px}
.code table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.55}
.code td{padding:0 8px;vertical-align:top;white-space:pre;font-family:"D2Coding",ui-monospace,SFMono-Regular,Consolas,monospace}
.code td.ln{text-align:right;color:var(--muted);user-select:none;width:1%;white-space:nowrap;
  border-right:1px solid var(--line);font-variant-numeric:tabular-nums;padding:0 8px}
.code tr.add{background:var(--add-bg)}
.code tr.add td.ln{color:var(--add-mark)}
.code tr.del{background:var(--del-bg)}
.code tr.del td.ln{color:var(--del-mark)}
.code tr.hit{box-shadow:inset 3px 0 0 var(--accent)}
.code tr.hit td.ln{color:var(--accent);font-weight:700}
details.src{margin:0 0 12px}
details.src>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 0}
details.src>summary:hover{color:var(--accent)}

/* ── 지적 카드 ──────────────────────────────────── */
.finding{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;
  padding:12px 14px;margin:10px 0;background:var(--panel)}
.finding.BLOCKER{border-left-color:var(--blocker)}
.finding.MAJOR{border-left-color:var(--major)}
.finding.MINOR{border-left-color:var(--minor)}
.finding>h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sev{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.03em}
.sev.BLOCKER{background:var(--blocker-bg);color:var(--blocker)}
.sev.MAJOR{background:var(--major-bg);color:var(--major)}
.sev.MINOR{background:var(--minor-bg);color:var(--minor)}
.persp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.fid{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);font-weight:700}
.loc{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.needsinfo{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--major-bg);color:var(--major)}
.finding dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:5px 12px;align-items:start}
.finding dt{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.finding dd{margin:0;min-width:0}
.finding dd pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.5}
.finding dd pre.was{background:var(--del-bg)}
.finding dd pre.now{background:var(--add-bg)}

/* ── 회의 진행 ──────────────────────────────────── */
.decide{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.decide .opts{display:flex;gap:4px}
.decide label{font-size:12px;padding:4px 11px;border:1px solid var(--line);border-radius:6px;
  cursor:pointer;user-select:none;white-space:nowrap}
.decide input{position:absolute;opacity:0;width:0;height:0}
.decide label:hover{border-color:var(--accent)}
.decide input:checked+span{font-weight:700}
.decide label.agree input:checked+span{color:var(--minor)}
.decide label.hold  input:checked+span{color:var(--major)}
.decide label.deny  input:checked+span{color:var(--blocker)}
.decide label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.decide textarea{flex:1 1 220px;min-width:180px;font:inherit;font-size:12.5px;padding:5px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical;min-height:32px}
.finding.decided{background:linear-gradient(90deg,var(--accent-soft) 0 3px,transparent 3px)}

/* ── SQL · 반려 · 미확인 ────────────────────────── */
.sqlbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.sqlbox h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sqlbox .path{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;word-break:break-all}
.sqlbox pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  overflow-x:auto;margin:8px 0;font-size:12.5px;line-height:1.55}
.sqlbox ul{margin:6px 0 0;padding-left:20px}
.simple td.issue b{color:var(--blocker)}
details.audit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px}
details.audit>summary{cursor:pointer;font-weight:600;font-size:14px}
details.audit table{margin-top:10px}
h2.sec{font-size:16px;margin:26px 0 12px}
.empty{color:var(--muted);padding:10px 0}

/* ── 인쇄 ───────────────────────────────────────── */
@media print{
  :root{--bg:#fff;--panel:#fff;--code:#f7f7f7;--shadow:none}
  body{font-size:10.5pt}
  .filters,.btns,nav.toc,.decide textarea{display:none!important}
  .layout{display:block}
  header{border-bottom:2px solid #000}
  section.file{break-inside:auto;page-break-inside:auto;border:1px solid #bbb;box-shadow:none}
  .unit{break-inside:avoid;page-break-inside:avoid}
  .finding{break-inside:avoid;page-break-inside:avoid}
  details.src,details.audit{display:block}
  details.src[open]>summary{list-style:none}
  .decide label{border:1px solid #999}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="grow">
      <h1 id="h-title">…</h1>
      <div class="sub" id="h-sub"></div>
      <div class="progress">회의 결정 <b><span id="p-done">0</span> / <span id="p-total">0</span></b>
        · 합의 <span id="p-agree">0</span> · 보류 <span id="p-hold">0</span> · 반려 <span id="p-deny">0</span></div>
      <div class="btns">
        <button id="b-md">회의 결과 마크다운 복사</button>
        <button id="b-json">결정 JSON 저장</button>
        <button id="b-open">원문 전부 펼치기</button>
        <button id="b-reset">결정 초기화</button>
        <button onclick="window.print()">인쇄</button>
      </div>
    </div>
    <div id="h-verdict" class="verdict">—</div>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <div class="fgroup"><span>관점</span>
      <button class="on flt" data-k="p" data-v="refactor">리팩토링</button>
      <button class="on flt" data-k="p" data-v="feature">기능</button>
      <button class="on flt" data-k="p" data-v="sql">SQL</button>
    </div>
    <div class="fgroup"><span>심각도</span>
      <button class="on flt" data-k="s" data-v="BLOCKER">BLOCKER</button>
      <button class="on flt" data-k="s" data-v="MAJOR">MAJOR</button>
      <button class="on flt" data-k="s" data-v="MINOR">MINOR</button>
    </div>
    <div class="fgroup"><span>결정</span>
      <button class="flt" data-k="d" data-v="undecided">미결정만</button>
    </div>
    <input type="search" id="q" placeholder="지적 내용 · 파일 · 근거 검색">
  </div>

  <div class="cards" id="dash"></div>

  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <main id="main"></main>
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('payload').textContent);
var PERSP = {refactor:'리팩토링', feature:'기능', sql:'SQL'};
var SEVS = ['BLOCKER','MAJOR','MINOR'];
var KEY = 'oi-review-' + (D.meta.prNumber || 'x');

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ── 저장된 결정 ─────────────────────────────── */
var store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

/* ── 헤더 ────────────────────────────────────── */
var m = D.meta;
document.getElementById('h-title').textContent =
  (m.prNumber ? '#' + m.prNumber + ' · ' : '') + (m.title || '코드리뷰');
var subs = [];
if (m.author) subs.push('작성 <b>' + esc(m.author) + '</b>');
if (m.baseRef) subs.push('<b>' + esc(m.baseRef) + '</b> &larr; <b>' + esc(m.headRef || '?') + '</b>');
if (m.headSha) subs.push('<span class="mono">' + esc(String(m.headSha).slice(0,10)) + '</span>');
if (m.generatedAt) subs.push('생성 ' + esc(m.generatedAt));
if (m.reviewers) subs.push(Object.keys(m.reviewers).map(function(k){
  return (PERSP[k]||k) + ' ' + m.reviewers[k]; }).join(' · '));
document.getElementById('h-sub').innerHTML = subs.join(' &nbsp;·&nbsp; ');
if (m.url) document.getElementById('h-sub').innerHTML +=
  ' &nbsp;·&nbsp; <a href="' + esc(m.url) + '">PR 열기</a>';
var vd = document.getElementById('h-verdict');
vd.textContent = m.verdict || '—'; vd.className = 'verdict ' + (m.verdict || '');

/* ── 대시보드 ────────────────────────────────── */
(function(){
  var counts = {}, tot = {BLOCKER:0,MAJOR:0,MINOR:0};
  Object.keys(PERSP).forEach(function(p){ counts[p] = {BLOCKER:0,MAJOR:0,MINOR:0}; });
  D.findings.forEach(function(f){
    if (!counts[f.perspective]) counts[f.perspective] = {BLOCKER:0,MAJOR:0,MINOR:0};
    counts[f.perspective][f.severity]++; tot[f.severity]++;
  });
  var rows = Object.keys(counts).map(function(p){
    return '<tr><td>' + (PERSP[p]||p) + '</td>' + SEVS.map(function(s){
      var n = counts[p][s];
      return '<td class="n' + (n?'':' zero') + '">' + n + '</td>';
    }).join('') + '<td class="n"><b>' + SEVS.reduce(function(a,s){return a+counts[p][s];},0) + '</b></td></tr>';
  }).join('');
  var byFile = {};
  D.findings.forEach(function(f){ byFile[f.file] = (byFile[f.file]||0) + 1; });
  var frows = D.files.map(function(f){
    return '<tr><td style="word-break:break-all">' + esc(f.path.split('/').pop()) +
      (f.priority === 1 ? ' <span class="tag p1">우선</span>' : '') +
      '</td><td>' + esc(f.changeType) + '</td><td class="n">' + (byFile[f.path]||0) + '</td></tr>';
  }).join('');
  document.getElementById('dash').innerHTML =
    '<div class="card"><h3>관점 × 심각도</h3><table class="mini"><tr><th>관점</th>' +
      SEVS.map(function(s){return '<th class="n">'+s+'</th>';}).join('') + '<th class="n">계</th></tr>' +
      rows + '<tr><td><b>계</b></td>' + SEVS.map(function(s){
        return '<td class="n"><b>'+tot[s]+'</b></td>'; }).join('') +
      '<td class="n"><b>' + D.findings.length + '</b></td></tr></table></div>' +
    '<div class="card"><h3>파일별 지적</h3><table class="mini">' +
      '<tr><th>파일</th><th>변경</th><th class="n">지적</th></tr>' + frows + '</table></div>' +
    '<div class="card"><h3>리뷰 범위</h3><table class="mini">' +
      '<tr><td>변경 파일</td><td class="n">' + D.files.length + '</td></tr>' +
      '<tr><td>변경단위</td><td class="n">' + D.units.length + '</td></tr>' +
      '<tr><td>단순 변경</td><td class="n">' + D.simpleChanges.length + '</td></tr>' +
      '<tr><td>SQL 검토</td><td class="n">' + D.sql.length + '</td></tr>' +
      '<tr><td>검증 반려</td><td class="n">' + D.rejected.length + '</td></tr>' +
      '<tr><td>확인 못 한 것</td><td class="n">' + D.unknowns.length + '</td></tr>' +
    '</table></div>';
})();

/* ── 코드 렌더 ───────────────────────────────── */
function codeTable(rows, hitLines){
  if (!rows || !rows.length) return '';
  var hits = {}; (hitLines||[]).forEach(function(n){ hits[n]=1; });
  var body = rows.map(function(r){
    var cls = r.type === 'add' ? 'add' : (r.type === 'del' ? 'del' : '');
    if (r.afterNo && hits[r.afterNo]) cls += ' hit';
    var no = r.type === 'del'
      ? '<span title="변경 전">-' + (r.beforeNo || '') + '</span>'
      : (r.afterNo || '');
    var sign = r.type === 'add' ? '+' : (r.type === 'del' ? '-' : ' ');
    return '<tr class="' + cls + '"><td class="ln">' + no + '</td><td>' +
           esc(sign + ' ' + r.text) + '</td></tr>';
  }).join('');
  return '<div class="code"><table>' + body + '</table></div>';
}

/* ── 지적 카드 ───────────────────────────────── */
function findingCard(f){
  var d = store[f.id] || {};
  var dl = '';
  function row(label, html){ dl += '<dt>' + label + '</dt><dd>' + html + '</dd>'; }
  row('문제', esc(f.problem));
  row('근거', '<b>' + esc(f.basis) + '</b>');
  if (f.before) row('변경 전', '<pre class="was">' + esc(f.before) + '</pre>');
  if (f.after)  row('변경 후', '<pre class="now">' + esc(f.after) + '</pre>');
  if (f.suggestion) row('개선', '<pre>' + esc(f.suggestion) + '</pre>');
  if (f.checkpoints) row('점검', esc(f.checkpoints));

  var opts = [['agree','합의'],['hold','보류'],['deny','반려']].map(function(o){
    return '<label class="' + o[0] + '"><input type="radio" name="dec-' + esc(f.id) + '" value="' +
      o[0] + '"' + (d.decision === o[0] ? ' checked' : '') + '><span>' + o[1] + '</span></label>';
  }).join('');

  var card = el(
    '<article class="finding ' + f.severity + (d.decision ? ' decided' : '') + '" id="f-' + esc(f.id) + '"' +
      ' data-p="' + esc(f.perspective) + '" data-s="' + esc(f.severity) + '" data-fid="' + esc(f.id) + '">' +
      '<h4><span class="sev ' + f.severity + '">' + f.severity + '</span>' +
        '<span class="persp">' + (PERSP[f.perspective] || f.perspective) + '</span>' +
        '<span class="fid">' + esc(f.id) + '</span>' +
        (f.verdict === 'NEEDS-INFO' ? '<span class="needsinfo">확인 필요</span>' : '') +
        '<span>' + esc(f.title) + '</span>' +
        '<span class="loc">' + esc(f.file.split('/').pop()) + ':' + esc(f.line) + '</span></h4>' +
      '<dl>' + dl + '</dl>' +
      '<div class="decide"><div class="opts">' + opts + '</div>' +
        '<textarea placeholder="회의 메모">' + esc(d.memo || '') + '</textarea></div>' +
    '</article>');

  card.querySelectorAll('input[type=radio]').forEach(function(r){
    r.addEventListener('change', function(){
      store[f.id] = store[f.id] || {};
      store[f.id].decision = r.value;
      card.classList.add('decided');
      save(); refreshProgress(); applyFilters();
    });
  });
  card.querySelector('textarea').addEventListener('input', function(e){
    store[f.id] = store[f.id] || {};
    store[f.id].memo = e.target.value;
    save();
  });
  return card;
}

/* ── 본문 ────────────────────────────────────── */
var main = document.getElementById('main');
var toc  = document.getElementById('toc');
var fByUnit = {};
D.findings.forEach(function(f){ (fByUnit[f.unitId] = fByUnit[f.unitId] || []).push(f); });
SEVS.forEach(function(){});
Object.keys(fByUnit).forEach(function(u){
  fByUnit[u].sort(function(a,b){ return SEVS.indexOf(a.severity) - SEVS.indexOf(b.severity); });
});

var files = D.files.slice().sort(function(a,b){
  return (a.priority - b.priority) || a.path.localeCompare(b.path);
});

var tocHtml = '';
files.forEach(function(file){
  var units = D.units.filter(function(u){ return u.file === file.path; });
  var sec = el('<section class="file" id="file-' + esc(cssId(file.path)) + '"></section>');
  sec.appendChild(el('<h2>' + esc(file.path) +
    '<span class="tag' + (file.priority === 1 ? ' p1' : '') + '">' + esc(file.changeType) + '</span>' +
    (file.renamedFrom ? '<span class="loc">← ' + esc(file.renamedFrom) + '</span>' : '') +
    (file.hasSql ? '<span class="tag">SQL</span>' : '') + '</h2>'));

  tocHtml += '<div class="f"><a href="#file-' + esc(cssId(file.path)) + '" style="border:0;padding-left:0">' +
             esc(file.path.split('/').pop()) + '</a></div>';

  if (!units.length) sec.appendChild(el('<div class="unit"><span class="empty">변경단위가 등록되지 않았습니다.</span></div>'));

  units.forEach(function(u){
    var fs = fByUnit[u.id] || [];
    var box = el('<div class="unit" id="unit-' + esc(u.id) + '" data-unit="' + esc(u.id) + '"></div>');
    var rng = u.afterLines ? ('after ' + u.afterLines[0] + '–' + u.afterLines[1])
            : (u.beforeLines ? ('before ' + u.beforeLines[0] + '–' + u.beforeLines[1]) : '');
    box.appendChild(el('<h3><span class="uid">' + esc(u.id) + '</span>' +
      '<span class="tag">' + esc(u.kind) + '</span>' +
      '<span class="sum">' + esc(u.summary) + '</span>' +
      '<span class="rng">' + esc(rng) + '</span></h3>'));
    var hit = fs.map(function(f){ return f.line; });
    if (u.rows && u.rows.length) box.appendChild(el(codeTable(u.rows, hit)));
    fs.forEach(function(f){ box.appendChild(findingCard(f)); });
    if (!fs.length) box.appendChild(el('<div class="empty">이 변경단위에 대한 지적 없음</div>'));
    sec.appendChild(box);

    tocHtml += '<a href="#unit-' + esc(u.id) + '"><span class="uid">' + esc(u.id) + '</span> ' +
               esc(u.summary) + (fs.length ? ' (' + fs.length + ')' : '') + '</a>';
  });

  if (file.lines && file.lines.length) {
    var src = el('<details class="src" style="margin:0 16px 14px"><summary>파일 원문 보기 (' +
      file.lines.length + '줄) — ' + esc(file.path) + '</summary></details>');
    src.appendChild(el(codeTable(file.lines, [])));
    sec.appendChild(src);
  }
  main.appendChild(sec);
});

/* 단순 변경 */
if (D.simpleChanges.length) {
  var s = el('<section class="file"><h2>단순 변경 요약</h2></section>');
  s.appendChild(el('<div class="unit"><table class="mini simple"><tr><th>변경단위</th><th>내용</th><th>이상점</th></tr>' +
    D.simpleChanges.map(function(c){
      var bad = c.issue && c.issue !== '없음';
      return '<tr><td>' + esc(c.unitId) + '</td><td>' + esc(c.content) + '</td>' +
             '<td class="issue">' + (bad ? '<b>' + esc(c.issue) + '</b>' : esc(c.issue || '없음')) + '</td></tr>';
    }).join('') + '</table></div>'));
  main.appendChild(s);
}

/* SQL */
if (D.sql.length) {
  var q = el('<section class="file" id="sec-sql"><h2>SQL 본문과 튜닝포인트</h2></section>');
  var body = el('<div class="unit"></div>');
  D.sql.forEach(function(s){
    body.appendChild(el('<div class="sqlbox"><h4><span class="fid">' + esc(s.id) + '</span>' +
      '<span class="tag">' + esc(s.callType) + '</span>' +
      '<span>' + esc(s.sqlId || '(인라인)') + '</span>' +
      (s.unitId ? '<span class="loc">' + esc(s.unitId) + '</span>' : '') + '</h4>' +
      (s.sourcePath ? '<div class="path">' + esc(s.sourcePath) + '</div>' : '') +
      '<pre>' + esc(s.body) + '</pre>' +
      (s.tuningPoints && s.tuningPoints.length
        ? '<b style="font-size:12px">튜닝포인트</b><ul>' +
          s.tuningPoints.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
        : '<div class="empty">튜닝포인트 없음</div>') + '</div>'));
  });
  q.appendChild(body); main.appendChild(q);
  tocHtml += '<div class="f"><a href="#sec-sql" style="border:0;padding-left:0">SQL 본문</a></div>';
}

/* 반려 · 미확인 */
if (D.rejected.length) {
  main.appendChild(el('<details class="audit"><summary>검증에서 반려된 지적 ' + D.rejected.length +
    '건 (본문에 싣지 않음)</summary><table class="mini"><tr><th>ID</th><th>관점</th><th>지적</th><th>반려 사유</th></tr>' +
    D.rejected.map(function(r){
      return '<tr><td>' + esc(r.id) + '</td><td>' + esc(PERSP[r.perspective] || r.perspective) +
             '</td><td>' + esc(r.title) + '</td><td>' + esc(r.reason) + '</td></tr>';
    }).join('') + '</table></details>'));
}
if (D.unknowns.length) {
  main.appendChild(el('<details class="audit" open><summary>확인 못 한 것 ' + D.unknowns.length +
    '건</summary><ul>' + D.unknowns.map(function(u){ return '<li>' + esc(u) + '</li>'; }).join('') +
    '</ul></details>'));
}
toc.innerHTML = tocHtml || '<div class="empty">변경 없음</div>';

function cssId(p){ return p.replace(/[^A-Za-z0-9_-]/g, '_'); }

/* ── 필터 ────────────────────────────────────── */
var F = { p:{refactor:1,feature:1,sql:1}, s:{BLOCKER:1,MAJOR:1,MINOR:1}, undecided:0, q:'' };
document.querySelectorAll('.flt').forEach(function(b){
  b.addEventListener('click', function(){
    if (b.dataset.k === 'd') { F.undecided = F.undecided ? 0 : 1; b.classList.toggle('on', !!F.undecided); }
    else { F[b.dataset.k][b.dataset.v] = F[b.dataset.k][b.dataset.v] ? 0 : 1;
           b.classList.toggle('on', !!F[b.dataset.k][b.dataset.v]); }
    applyFilters();
  });
});
document.getElementById('q').addEventListener('input', function(e){
  F.q = e.target.value.trim().toLowerCase(); applyFilters();
});
function applyFilters(){
  document.querySelectorAll('.finding').forEach(function(c){
    var id = c.dataset.fid, dec = (store[id] || {}).decision;
    var ok = F.p[c.dataset.p] && F.s[c.dataset.s]
          && (!F.undecided || !dec)
          && (!F.q || c.textContent.toLowerCase().indexOf(F.q) >= 0);
    c.style.display = ok ? '' : 'none';
  });
  document.querySelectorAll('.unit').forEach(function(u){
    var all = u.querySelectorAll('.finding'), vis = 0;
    all.forEach(function(c){ if (c.style.display !== 'none') vis++; });
    var dim = all.length > 0 && vis === 0;
    u.style.opacity = dim ? .38 : 1;
  });
}

/* ── 진행 표시 ───────────────────────────────── */
function refreshProgress(){
  var n = {agree:0, hold:0, deny:0};
  D.findings.forEach(function(f){
    var d = (store[f.id] || {}).decision; if (d && n[d] !== undefined) n[d]++;
  });
  var done = n.agree + n.hold + n.deny;
  document.getElementById('p-done').textContent  = done;
  document.getElementById('p-total').textContent = D.findings.length;
  document.getElementById('p-agree').textContent = n.agree;
  document.getElementById('p-hold').textContent  = n.hold;
  document.getElementById('p-deny').textContent  = n.deny;
}
refreshProgress();

/* ── 내보내기 ────────────────────────────────── */
var LABEL = {agree:'합의', hold:'보류', deny:'반려'};
function decisionsMd(){
  var lines = ['# 코드리뷰 회의 결과 — ' + (m.prNumber ? '#' + m.prNumber + ' ' : '') + (m.title || ''), ''];
  lines.push('- 대상: ' + (m.baseRef || '') + ' ← ' + (m.headRef || ''));
  lines.push('- 리뷰 판정: ' + (m.verdict || '-'));
  lines.push('- 작성: ' + new Date().toLocaleString('ko-KR'));
  lines.push('', '| ID | 관점 | 심각도 | 위치 | 지적 | 결정 | 메모 |', '|---|---|---|---|---|---|---|');
  D.findings.forEach(function(f){
    var d = store[f.id] || {};
    lines.push('| ' + f.id + ' | ' + (PERSP[f.perspective] || f.perspective) + ' | ' + f.severity +
      ' | ' + f.file.split('/').pop() + ':' + f.line + ' | ' + String(f.title).replace(/\|/g, '\\|') +
      ' | ' + (LABEL[d.decision] || '미결정') + ' | ' + String(d.memo || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |');
  });
  var open = D.findings.filter(function(f){ return !(store[f.id] || {}).decision; });
  if (open.length) {
    lines.push('', '## 미결정 ' + open.length + '건', '');
    open.forEach(function(f){ lines.push('- ' + f.id + ' · ' + f.severity + ' · ' + f.title); });
  }
  return lines.join('\n');
}
function download(name, text, mime){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
document.getElementById('b-md').addEventListener('click', function(){
  var md = decisionsMd();
  var done = function(ok){
    this.textContent = ok ? '복사했습니다' : '복사 실패 — 파일로 저장했습니다';
    if (!ok) download('review-' + (m.prNumber || 'x') + '-decisions.md', md, 'text/markdown');
    setTimeout(function(){ this.textContent = '회의 결과 마크다운 복사'; }.bind(this), 2000);
  }.bind(this);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(function(){ done(true); }, function(){ done(false); });
  } else { done(false); }
});
document.getElementById('b-json').addEventListener('click', function(){
  download('review-' + (m.prNumber || 'x') + '-decisions.json',
    JSON.stringify({meta: m, decisions: store}, null, 2), 'application/json');
});
document.getElementById('b-open').addEventListener('click', function(){
  var any = Array.prototype.some.call(document.querySelectorAll('details'), function(d){ return !d.open; });
  document.querySelectorAll('details').forEach(function(d){ d.open = any; });
  this.textContent = any ? '원문 전부 접기' : '원문 전부 펼치기';
});
document.getElementById('b-reset').addEventListener('click', function(){
  if (!confirm('이 PR 의 회의 결정과 메모를 모두 지웁니다. 계속할까요?')) return;
  store = {}; save(); location.reload();
});

applyFilters();
})();
</script>
</body>
</html>
