<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#eaf0ff;
  --blocker:#b91c1c; --blocker-bg:#fee2e2;
  --major:#b45309;  --major-bg:#fef3c7;
  --minor:#3f6212;  --minor-bg:#ecfccb;
  --add-bg:#e6ffed; --add-mark:#22863a;
  --del-bg:#ffeef0; --del-mark:#b31d28;
  --code:#f3f4f6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --t-com:#6a737d; --t-kw:#cf222e; --t-type:#6f42c1; --t-str:#0a3069;
  --t-num:#0550ae; --t-sql:#8250df; --t-op:#57606a; --t-fn:#6639ba;
  color-scheme:light;
}

/* 시스템 설정을 따르는 기본 상태 — 사용자가 라이트를 고르면 적용하지 않습니다 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#14171a; --panel:#1c2024; --ink:#e6e8eb; --muted:#9aa1ab; --line:#2c3138;
  --accent:#6ea8ff; --accent-soft:#1c2b46;
  --blocker:#fca5a5; --blocker-bg:#3b1414;
  --major:#fcd34d;  --major-bg:#3a2b08;
  --minor:#bef264;  --minor-bg:#1f2d0b;
  --add-bg:#122b1a; --add-mark:#4ade80;
  --del-bg:#331418; --del-mark:#fca5a5;
  --code:#12151a; --shadow:none;
  --t-com:#8b949e; --t-kw:#ff7b72; --t-type:#d2a8ff; --t-str:#a5d6ff;
  --t-num:#79c0ff; --t-sql:#e2b8ff; --t-op:#a5aab1; --t-fn:#d2a8ff;
  color-scheme:dark;
  }
}

/* 버튼으로 고른 값이 시스템 설정을 이깁니다 */
:root[data-theme="dark"]{
  --bg:#14171a; --panel:#1c2024; --ink:#e6e8eb; --muted:#9aa1ab; --line:#2c3138;
  --accent:#6ea8ff; --accent-soft:#1c2b46;
  --blocker:#fca5a5; --blocker-bg:#3b1414;
  --major:#fcd34d;  --major-bg:#3a2b08;
  --minor:#bef264;  --minor-bg:#1f2d0b;
  --add-bg:#122b1a; --add-mark:#4ade80;
  --del-bg:#331418; --del-mark:#fca5a5;
  --code:#12151a; --shadow:none;
  --t-com:#8b949e; --t-kw:#ff7b72; --t-type:#d2a8ff; --t-str:#a5d6ff;
  --t-num:#79c0ff; --t-sql:#e2b8ff; --t-op:#a5aab1; --t-fn:#d2a8ff;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --panel:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#eaf0ff;
  --blocker:#b91c1c; --blocker-bg:#fee2e2;
  --major:#b45309;  --major-bg:#fef3c7;
  --minor:#3f6212;  --minor-bg:#ecfccb;
  --add-bg:#e6ffed; --add-mark:#22863a;
  --del-bg:#ffeef0; --del-mark:#b31d28;
  --code:#f3f4f6; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --t-com:#6a737d; --t-kw:#cf222e; --t-type:#6f42c1; --t-str:#0a3069;
  --t-num:#0550ae; --t-sql:#8250df; --t-op:#57606a; --t-fn:#6639ba;
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
code,pre,.mono{font-family:"D2Coding",ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
a{color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px 80px}

/* ── 헤더 ───────────────────────────────────────── */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 0 14px;margin-bottom:16px}
.hd{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hd h1{margin:0 0 4px;font-size:20px;line-height:1.4}
.hd .sub{color:var(--muted);font-size:13px}
.hd .sub b{color:var(--ink);font-weight:600}
.grow{flex:1 1 320px;min-width:280px}
.verdict{font-size:22px;font-weight:800;letter-spacing:.06em;padding:8px 18px;border-radius:10px;white-space:nowrap}
.verdict.PASS{color:var(--minor);background:var(--minor-bg)}
.verdict.FAIL{color:var(--blocker);background:var(--blocker-bg)}
.progress{font-size:13px;color:var(--muted);margin-top:8px}
.progress b{color:var(--ink);font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ── 검색 ───────────────────────────────────────── */
.filters{position:sticky;top:0;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;margin-bottom:18px;display:flex;gap:12px;align-items:center;
  flex-wrap:wrap;box-shadow:var(--shadow)}
.filters input[type=search]{flex:1 1 220px;min-width:160px;font:inherit;font-size:13px;padding:6px 10px;
  border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.filters .note{font-size:12px;color:var(--muted)}

/* ── 리뷰 범위 (한 줄 스트립) ───────────────────── */
.scope{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;
  margin-bottom:22px;box-shadow:var(--shadow);display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
.scope>.t{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.scope span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.scope b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;margin-left:4px}

/* ── 대시보드 ───────────────────────────────────── */
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th,table.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{color:var(--muted);font-weight:600;font-size:12px}
table.mini td.n{text-align:right;font-variant-numeric:tabular-nums}
.zero{color:var(--muted)}

/* ── 산문 타이포그래피 ──────────────────────────── */
/* 한글은 단어 중간에서 끊으면 급격히 읽기 어려워집니다. keep-all 이 핵심. */
.prose{max-width:66ch;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
.prose p{margin:0 0 .7em}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:700}
.prose ul{margin:.4em 0 0;padding-left:1.15em}
.prose li{margin:.3em 0;line-height:1.75}

/* ── 개요 · 종합 평가 ───────────────────────────── */
.band{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;align-items:start}
@media (max-width:1000px){.band{grid-template-columns:1fr}}
.band>section{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;min-width:0}
.band>section>h2{margin:0;padding:11px 16px;font-size:14px;background:var(--code);
  border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.band .body{padding:14px 16px}
.band .prose{max-width:none}
.band h3{margin:14px 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.band h3:first-child{margin-top:0}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.stat b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.agenda{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.agenda button{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;padding:3px 9px;
  border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--accent);cursor:pointer}
.agenda button:hover{background:var(--accent-soft);border-color:var(--accent)}
.agenda .ord{color:var(--muted);font-weight:400;margin-right:3px}

/* ── 유형 범례 ──────────────────────────────────── */
details.legend{border-top:1px solid var(--line);background:var(--code)}
details.legend>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:8px 16px;list-style:none}
details.legend>summary::-webkit-details-marker{display:none}
details.legend>summary::before{content:"▸ ";font-size:11px}
details.legend[open]>summary::before{content:"▾ "}
details.legend>summary:hover{color:var(--accent)}
details.legend .inner{padding:0 16px 12px}
details.legend table{width:100%;border-collapse:collapse;font-size:12.5px}
details.legend td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
details.legend td:first-child{width:1%;white-space:nowrap}
details.legend tr:last-child td{border-bottom:0}

/* ── 요약 섹션 (체크리스트 · 변경 요약) ─────────── */
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
section.panel>h2{margin:0;padding:12px 16px;font-size:15px;background:var(--code);
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section.panel>h2 .note{font-size:12px;font-weight:400;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:12px;color:var(--muted);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr[data-jump]{cursor:pointer}
table.list tr[data-jump]:hover td{background:var(--accent-soft)}
table.list td.t{width:100%}
table.list td.nw{white-space:nowrap}
table.list .loc{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.dec{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;
  background:var(--code);color:var(--muted)}
.dec.agree{background:var(--minor-bg);color:var(--minor)}
.dec.hold{background:var(--major-bg);color:var(--major)}
.dec.deny{background:var(--blocker-bg);color:var(--blocker)}
tr.grp td{background:var(--code);font-weight:700;font-size:12px;color:var(--muted);
  letter-spacing:.03em;padding:6px 10px}
.hitn{font-variant-numeric:tabular-nums;white-space:nowrap}
.hitn .b{color:var(--blocker);font-weight:700}
.hitn .m{color:var(--major);font-weight:700}
.hitn .n{color:var(--minor)}
.hitn .none{color:var(--muted)}

/* ── 본문 레이아웃 ──────────────────────────────── */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.layout>main{min-width:0}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.toc{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}
nav.toc .f{margin:10px 0 4px;font-weight:700;word-break:break-all;line-height:1.4}
nav.toc .f:first-child{margin-top:0}
nav.toc a{display:block;padding:2px 0 2px 10px;color:var(--muted);text-decoration:none;
  border-left:2px solid var(--line);line-height:1.45}
nav.toc a:hover{color:var(--accent);border-left-color:var(--accent)}
nav.toc a .uid{color:var(--ink);font-weight:600}

/* ── 파일 / 변경단위 ────────────────────────────── */
section.file{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:20px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.unit,.finding{min-width:0}
.file>h2{margin:0;padding:12px 16px;font-size:15px;background:var(--code);
  border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;word-break:break-all}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);
  color:var(--accent);white-space:nowrap;letter-spacing:.02em}
.tag.p1{background:var(--major-bg);color:var(--major)}
/* '단순' 은 변경 유형이 아니라 "판단이 필요 없다"는 표시 — 모양을 다르게 둡니다 */
.tag.plain{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
.unit{border-top:1px solid var(--line);padding:14px 16px}
.unit:first-of-type{border-top:none}
.unit>h3{margin:0 0 10px;font-size:14px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.unit>h3 .uid{font-weight:800;color:var(--accent)}
.unit>h3 .sum{font-weight:500;color:var(--ink)}
.unit>h3 .rng{color:var(--muted);font-size:12px;font-weight:400}
.unit:target>h3 .uid,.finding:target .fid{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}

/* ── 코드 ───────────────────────────────────────── */
details.fold{margin:0 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--code)}
details.fold>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:7px 12px;
  list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--muted);font-size:11px}
details.fold[open]>summary::before{content:"▾"}
details.fold>summary:hover{color:var(--accent)}
details.fold>summary .plus{color:var(--add-mark);font-weight:700}
details.fold>summary .minus{color:var(--del-mark);font-weight:700}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
.code{overflow-x:auto}
.code table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.55}
.code td{padding:0 8px;vertical-align:top;white-space:pre;font-family:"D2Coding",ui-monospace,SFMono-Regular,Consolas,monospace}
.code td.ln{text-align:right;color:var(--muted);user-select:none;width:1%;white-space:nowrap;
  border-right:1px solid var(--line);font-variant-numeric:tabular-nums;padding:0 8px}
.code tr.add{background:var(--add-bg)}
.code tr.add td.ln{color:var(--add-mark)}
.code tr.del{background:var(--del-bg)}
.code tr.del td.ln{color:var(--del-mark)}
.code tr.hit{box-shadow:inset 3px 0 0 var(--accent)}

/* 나란히 보기 — 폭이 반이므로 가로 스크롤 대신 줄바꿈합니다 */
.code table.split{table-layout:fixed}
.code table.split td.c{width:50%;white-space:pre-wrap;overflow-wrap:anywhere;
  border-right:1px solid var(--line)}
.code table.split td.c:last-child{border-right:0}
.code table.split td.ln{width:46px}
.code table.split td.del{background:var(--del-bg)}
.code table.split td.add{background:var(--add-bg)}
.code table.split td.gap{background:repeating-linear-gradient(45deg,
  transparent,transparent 5px,var(--line) 5px,var(--line) 6px);opacity:.35}
.code table.split tr.hit td.ln:nth-child(3){color:var(--accent);font-weight:700}
.code tr.hit td.ln{color:var(--accent);font-weight:700}

/* 문법 토큰 */
.t-com{color:var(--t-com);font-style:italic}
.t-kw{color:var(--t-kw)}
.t-type{color:var(--t-type)}
.t-str{color:var(--t-str)}
.t-num{color:var(--t-num)}
.t-sql{color:var(--t-sql);font-weight:600}
.t-fn{color:var(--t-fn)}
.t-op{color:var(--t-op)}

/* ── 지적 카드 ──────────────────────────────────── */
.finding{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;
  padding:12px 14px;margin:10px 0;background:var(--panel)}
.finding.BLOCKER{border-left-color:var(--blocker)}
.finding.MAJOR{border-left-color:var(--major)}
.finding.MINOR{border-left-color:var(--minor)}
.finding>h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sev{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.03em}
.sev.BLOCKER{background:var(--blocker-bg);color:var(--blocker)}
.sev.MAJOR{background:var(--major-bg);color:var(--major)}
.sev.MINOR{background:var(--minor-bg);color:var(--minor)}
.persp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.fid{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);font-weight:700}
.loc{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace}
.needsinfo{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--major-bg);color:var(--major)}
.finding dl{margin:0;display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px 14px;align-items:start}
.finding dt{font-size:12px;color:var(--muted);font-weight:600;padding-top:3px;word-break:keep-all}
.finding dd{margin:0;min-width:0}
.finding dd pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.5}
.finding dd pre.was{background:var(--del-bg)}
.finding dd pre.now{background:var(--add-bg)}
.seecode{font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}

/* ── 회의 진행 ──────────────────────────────────── */
.decide{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.decide .opts{display:flex;gap:4px}
.decide label{font-size:12px;padding:4px 11px;border:1px solid var(--line);border-radius:6px;
  cursor:pointer;user-select:none;white-space:nowrap}
.decide input{position:absolute;opacity:0;width:0;height:0}
.decide label:hover{border-color:var(--accent)}
.decide input:checked+span{font-weight:700}
.decide label.agree input:checked+span{color:var(--minor)}
.decide label.hold  input:checked+span{color:var(--major)}
.decide label.deny  input:checked+span{color:var(--blocker)}
.decide label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.decide textarea{flex:1 1 220px;min-width:180px;font:inherit;font-size:12.5px;padding:5px 8px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical;min-height:32px}

/* ── SQL · 반려 · 미확인 ────────────────────────── */
.sqlbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.sqlbox h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sqlbox .path{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;word-break:break-all}
.sqlbox pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  overflow-x:auto;margin:8px 0;font-size:12.5px;line-height:1.55}
.sqlbox ul{margin:6px 0 0;padding-left:20px}
.simple td.issue b{color:var(--blocker)}
details.audit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px}
details.audit>summary{cursor:pointer;font-weight:600;font-size:14px}
details.audit table{margin-top:10px}
h2.sec{font-size:16px;margin:26px 0 12px}
.empty{color:var(--muted);padding:10px 0}

/* ── 인쇄 ───────────────────────────────────────── */
@media print{
  /* 화면 테마와 무관하게 종이는 항상 밝게. 속성 선택자보다 뒤에 와야 이깁니다 */
  :root,:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#fff; --panel:#fff; --ink:#1c2024; --muted:#6b7280; --line:#e2e5ea;

  --del-bg:#ffeef0; --del-mark:#b31d28;
  --code:#f7f7f7; --shadow:none;

}

<script>
/* 저장된 테마를 첫 페인트 전에 적용합니다 (안 그러면 잘못된 색이 한 번 번쩍입니다).
   키는 PR 별 저장소와 분리 — 테마는 사람 취향이라 리포트마다 다를 이유가 없습니다. */
(function(){
  try {
    var t = localStorage.getItem('oi-review-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
</head>
<body>
<header>
  <div class="hd">
    <div class="grow">
      <h1 id="h-title">…</h1>
      <div class="sub" id="h-sub"></div>
      <div class="progress">회의 결정 <b><span id="p-done">0</span> / <span id="p-total">0</span></b>
        · 합의 <span id="p-agree">0</span> · 보류 <span id="p-hold">0</span> · 반려 <span id="p-deny">0</span></div>
      <div class="btns">
        <button id="b-md">회의 결과 마크다운 복사</button>
        <button id="b-json">결정 JSON 저장</button>
        <button id="b-open">코드 전부 펼치기</button>
        <button id="b-diff" title="코드 변경을 위아래로 볼지, 좌우로 볼지">보기: 위아래</button>
        <button id="b-theme" title="시스템 → 라이트 → 다크 순으로 바뀝니다">테마: 시스템</button>
        <button id="b-reset">결정 초기화</button>
        <button onclick="window.print()">인쇄</button>
      </div>
    </div>
    <div id="h-verdict" class="verdict">—</div>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <input type="search" id="q" placeholder="지적 내용 · 파일 · 근거 검색">
    <span class="note" id="cl-note"></span>
  </div>

  <div class="band">
    <section id="overview"><h2>전체 변경사항 요약</h2><div class="body" id="ov-body"></div></section>
    <section id="assessment"><h2>종합 평가</h2><div class="body" id="as-body"></div></section>

    <h2>리뷰 체크리스트 <span class="note">심각도 순 · 행을 누르면 상세로 이동합니다</span></h2>
    <div class="tblwrap"><table class="list" id="cl-table"></table></div>
  </section>

  <section class="panel" id="changes">
    <h2>변경 요약 <span class="note">이 PR 이 무엇을 바꿨는지. 행을 누르면 해당 코드로 이동합니다</span></h2>
    <details class="legend">

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('payload').textContent);
var PERSP = {refactor:'리팩토링', feature:'기능', sql:'SQL'};
var SEVS = ['BLOCKER','MAJOR','MINOR'];
var LABEL = {agree:'합의', hold:'보류', deny:'반려'};
var KEY = 'oi-review-' + (D.meta.prNumber || 'x');

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* ══ 문법 하이라이트 ═══════════════════════════════════════════════
   외부 라이브러리를 못 쓰므로(폐쇄망·외부 요청 0) 작은 토크나이저를 직접 둡니다.
   diff 는 줄 단위로 그려지니, 여러 줄에 걸친 블록 주석과 축자 문자열(@"…")을
   놓치지 않도록 **줄 사이에 상태를 들고 갑니다.**                        */

var CS_KW = ('abstract as async await base break case catch checked class const continue default delegate ' +
  'do else enum event explicit extern finally fixed for foreach get goto if implicit in interface internal ' +
  'is lock namespace new null operator out override params partial private protected public readonly ref ' +
  'return sealed set sizeof stackalloc static struct switch this throw try typeof unchecked unsafe using ' +
  'value virtual volatile where while yield true false nameof').split(' ');
var CS_TYPE = ('bool byte char decimal double float int long object sbyte short string uint ulong ushort void var ' +
  'dynamic List Dictionary IEnumerable Task Nullable').split(' ');
var SQL_KW = ('select from where and or not in exists between like is null as inner left right outer full join on ' +
  'group by having order asc desc union all insert into values update set delete create alter drop table view ' +
  'index distinct count sum avg min max case when then else end with over partition trim substr to_char to_date ' +
  'nvl decode sysdate rownum dual limit offset').split(' ');

var CSKW = {}, CSTY = {}, SQLK = {};
CS_KW.forEach(function(k){ CSKW[k]=1; });
CS_TYPE.forEach(function(k){ CSTY[k]=1; });
SQL_KW.forEach(function(k){ SQLK[k.toUpperCase()]=1; });

function span(cls, txt){ return '<span class="t-' + cls + '">' + esc(txt) + '</span>'; }

/** SQL 한 조각 (문자열 안이든 밖이든) */
function hlSqlText(src){
  var out = '', re = /(--[^\n]*)|('(?:''|[^'])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_$#]*)|(:\w+|#\{\w+\}|\{[^}]*\})/g;
  var last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1])      out += span('com', m[1]);
    else if (m[2]) out += span('str', m[2]);
    else if (m[3]) out += span('num', m[3]);
    else if (m[5]) out += span('type', m[5]);          // 바인드 변수
    else if (m[4]) out += SQLK[m[4].toUpperCase()] ? span('sql', m[4]) : esc(m[4]);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function looksSql(s){ return /\b(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE)\b/i.test(s); }

/** C# 한 줄. st 는 줄 사이로 이어지는 상태 {block, verb, sql} */
function hlCsLine(src, st){
  var out = '';

  // 이어지는 블록 주석
  if (st.block) {
    var e = src.indexOf('*/');
    if (e < 0) return span('com', src);
    out += span('com', src.slice(0, e + 2)); st.block = false; src = src.slice(e + 2);
  }
  // 이어지는 축자 문자열 — SqlManager 의 $@"…" 여러 줄 SQL 이 여기 걸립니다
  if (st.verb) {
    var i = 0, close = -1;
    while (i < src.length) {
      if (src[i] === '"') { if (src[i+1] === '"') { i += 2; continue; } close = i; break; }
      i++;
    }
    var chunk = close < 0 ? src : src.slice(0, close + 1);
    out += '<span class="t-str">' + (st.sql ? hlSqlText(chunk) : esc(chunk)) + '</span>';
    if (close < 0) return out;
    st.verb = false; st.sql = false; src = src.slice(close + 1);
  }

  var re = /(\/\/[^\n]*)|(\/\*)|([@$]{1,2}")|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\d_]*(?:\.\d+)?[fFdDmMuUlL]*\b)|(#\s*\w+)|([A-Za-z_]\w*)/g;
  var last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;

    if (m[1]) { out += span('com', m[1]); continue; }
    if (m[2]) {                                    // 블록 주석 시작
      var end = src.indexOf('*/', m.index + 2);
      if (end < 0) { out += span('com', src.slice(m.index)); return out; }
      out += span('com', src.slice(m.index, end + 2)); re.lastIndex = last = end + 2; continue;
    }
    if (m[3]) {                                    // 축자/보간 문자열 시작
      var j = m.index + m[3].length, cl = -1;
      while (j < src.length) {
        if (src[j] === '"') { if (src[j+1] === '"') { j += 2; continue; } cl = j; break; }
        j++;
      }
      var body = cl < 0 ? src.slice(m.index) : src.slice(m.index, cl + 1);
      var sqlish = looksSql(body) || (cl < 0 && /AddSql|SELECT/i.test(src));
      out += '<span class="t-str">' + (sqlish ? hlSqlText(body) : esc(body)) + '</span>';
      if (cl < 0) { st.verb = true; st.sql = sqlish; return out; }
      re.lastIndex = last = cl + 1; continue;
    }
    if (m[4]) { out += span('str', m[4]); continue; }
    if (m[5]) { out += span('num', m[5]); continue; }
    if (m[6]) { out += span('com', m[6]); continue; }
    if (m[7]) {
      var w = m[7];
      if (CSKW[w])      out += span('kw', w);
      else if (CSTY[w]) out += span('type', w);
      else if (src[re.lastIndex] === '(') out += span('fn', w);
      else if (/^[A-Z]/.test(w)) out += span('type', w);
      else out += esc(w);
      continue;
    }
  }
  return out + esc(src.slice(last));
}

function newState(){ return {block:false, verb:false, sql:false}; }
function hlLine(src, st, lang){
  if (lang === 'cs')  return hlCsLine(src, st);
  if (lang === 'sql') return hlSqlText(src);
  return esc(src);
}
/** 여러 줄 덩어리 (지적 카드의 코드 조각, SQL 본문) */
function hlBlock(src, lang){
  if (lang === 'sql') return hlSqlText(String(src));
  if (lang !== 'cs')  return esc(src);
  var st = newState();
  return String(src).split('\n').map(function(l){ return hlCsLine(l, st); }).join('\n');
}

/* ── 저장된 결정 ─────────────────────────────── */
var store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function decOf(id){ return (store[id] || {}).decision || ''; }

/* ── 헤더 ────────────────────────────────────── */
var m = D.meta;
document.getElementById('h-title').textContent =
  (m.prNumber ? '#' + m.prNumber + ' · ' : '') + (m.title || '코드리뷰');
var subs = [];
if (m.author) subs.push('작성 <b>' + esc(m.author) + '</b>');
if (m.baseRef) subs.push('<b>' + esc(m.baseRef) + '</b> &larr; <b>' + esc(m.headRef || '?') + '</b>');
if (m.headSha) subs.push('<span class="mono">' + esc(String(m.headSha).slice(0,10)) + '</span>');
if (m.generatedAt) subs.push('생성 ' + esc(m.generatedAt));
if (m.reviewers) subs.push(Object.keys(m.reviewers).map(function(k){
  return (PERSP[k]||k) + ' ' + m.reviewers[k]; }).join(' · '));
document.getElementById('h-sub').innerHTML = subs.join(' &nbsp;·&nbsp; ') +
  (m.url ? ' &nbsp;·&nbsp; <a href="' + esc(m.url) + '">PR 열기</a>' : '');
var vd = document.getElementById('h-verdict');
vd.textContent = m.verdict || '—'; vd.className = 'verdict ' + (m.verdict || '');

/* ── 산문 렌더 ───────────────────────────────── */
/* 줄바꿈을 문단으로 끊고, **굵게** 만 최소로 살립니다. 한 덩어리 글은 읽히지 않습니다. */
function prose(txt){
  return String(txt == null ? '' : txt).split(/\n\s*\n|\n/).filter(function(l){ return l.trim(); })
    .map(function(l){
      return '<p>' + esc(l.trim()).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') + '</p>';
    }).join('');
}
function bullets(list){
  if (!list || !list.length) return '';
  return '<ul>' + list.map(function(t){
    return '<li>' + esc(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') + '</li>';
  }).join('') + '</ul>';
}

/* ── 개요 · 종합 평가 (결론부터) ─────────────── */
(function(){
  var ov = D.overview || {}, as = D.assessment || {};

  var oh = '<div class="prose">' + prose(ov.narrative) + '</div>';
  if (ov.highlights && ov.highlights.length)
    oh += '<h3>눈에 띄는 변경</h3><div class="prose">' + bullets(ov.highlights) + '</div>';
  oh += '<div class="stat">' +
        '<span>변경 파일 <b>' + D.files.length + '</b></span>' +
        '<span>변경단위 <b>' + D.units.length + '</b></span>' +
        '<span>지적 <b>' + D.findings.length + '</b></span>' +
        '<span>BLOCKER <b>' + D.findings.filter(function(f){return f.severity==='BLOCKER';}).length + '</b></span>' +
        '<span>SQL <b>' + D.sql.length + '</b></span></div>';
  document.getElementById('ov-body').innerHTML = oh;

  var ah = '<div class="prose">' + prose(as.conclusion) + '</div>';
  if (as.rechecks && as.rechecks.length)
    ah += '<h3>재확인 필요사항</h3><div class="prose">' + bullets(as.rechecks) + '</div>';
  if (as.goodPoints && as.goodPoints.length)
    ah += '<h3>잘된 점</h3><div class="prose">' + bullets(as.goodPoints) + '</div>';
  if (as.agenda && as.agenda.length) {
    ah += '<h3>회의 진행 순서</h3><div class="agenda">' + as.agenda.map(function(id, i){
      return '<button data-go="f-' + esc(id) + '"><span class="ord">' + (i+1) + '.</span>' + esc(id) + '</button>';
    }).join('') + '</div>';
  }
  document.getElementById('as-body').innerHTML = ah;

  document.querySelector('#assessment h2').insertAdjacentHTML('beforeend',
    '<span class="verdict ' + (m.verdict||'') + '" style="font-size:13px;padding:3px 10px">' +
    (m.verdict || '—') + '</span>');

  document.querySelectorAll('.agenda button').forEach(function(b){
    b.addEventListener('click', function(){ jump(b.dataset.go); });
  });
})();

/* ── 유형 범례 ───────────────────────────────── */
document.getElementById('legend-table').innerHTML = [
  ['신규',     'before 원문에 <b>없던</b> 코드', ''],
  ['변경',     '있던 것이 고쳐짐', '<b>리네이밍·시그니처 변경도 여기</b>입니다'],
  ['삭제',     'after 에 없어짐', ''],
  ['이름변경', '이름만 바뀌고 내용은 같음', '내용도 바뀌었으면 <b>변경</b>'],
  ['이동',     '위치만 바뀜 (다른 파일·다른 위치)', '내용도 바뀌었으면 <b>변경</b>'],
  ['단순',     '<b>유형이 아닙니다.</b> 판단이 필요 없는 변경이라는 표시', '변수명 정리·미사용 코드 삭제 등']
].map(function(r){
  var cls = r[0] === '단순' ? 'tag plain' : 'tag';
  return '<tr><td><span class="' + cls + '">' + r[0] + '</span></td><td>' + r[1] +
         (r[2] ? ' <span style="color:var(--muted)">— ' + r[2] + '</span>' : '') + '</td></tr>';
}).join('');

/* ── 리뷰 범위 (한 줄) ───────────────────────── */
(function(){
  var b = D.findings.filter(function(f){ return f.severity === 'BLOCKER'; }).length;
  var m = D.findings.filter(function(f){ return f.severity === 'MAJOR'; }).length;
  var n = D.findings.filter(function(f){ return f.severity === 'MINOR'; }).length;
  document.getElementById('dash').innerHTML =
    '<span class="t">리뷰 범위</span>' +
    '<span>변경 파일<b>' + D.files.length + '</b></span>' +
    '<span>변경단위<b>' + D.units.length + '</b></span>' +
    '<span>단순 변경<b>' + D.simpleChanges.length + '</b></span>' +
    '<span>지적<b>' + D.findings.length + '</b></span>' +
    '<span style="color:var(--blocker)">BLOCKER<b style="color:var(--blocker)">' + b + '</b></span>' +
    '<span style="color:var(--major)">MAJOR<b style="color:var(--major)">' + m + '</b></span>' +
    '<span>MINOR<b>' + n + '</b></span>' +
    '<span>SQL 검토<b>' + D.sql.length + '</b></span>' +
    '<span>검증 반려<b>' + D.rejected.length + '</b></span>' +
    '<span>확인 못 한 것<b>' + D.unknowns.length + '</b></span>';
})();

/* ── 이동 ────────────────────────────────────── */
function jump(id){
  var t = document.getElementById(id);
  if (!t) return;
  var fold = t.closest('.unit') && t.closest('.unit').querySelector('details.fold');
  if (t.classList.contains('finding') && fold) { /* 코드는 필요할 때만 */ }
  t.scrollIntoView({behavior:'smooth', block:'center'});
  t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
}

/* ── 리뷰 체크리스트 (가장 먼저 보는 표) ─────── */
var order = {BLOCKER:0, MAJOR:1, MINOR:2};
var sorted = D.findings.slice().sort(function(a,b){
  return (order[a.severity] - order[b.severity]) || a.id.localeCompare(b.id);
});
(function(){
  var t = document.getElementById('cl-table');
  if (!D.findings.length) {
    document.getElementById('checklist').innerHTML =
      '<h2>리뷰 체크리스트</h2><div class="empty" style="padding:14px 16px">지적 없음 — 회의에서 볼 항목이 없습니다.</div>';
    return;
  }
  var html = '<tr><th>결정</th><th>심각도</th><th>관점</th><th>ID</th><th>지적</th><th>위치</th><th>단위</th></tr>';
  var cur = null;
  sorted.forEach(function(f){
    if (f.severity !== cur) {
      cur = f.severity;
      var n = D.findings.filter(function(x){ return x.severity === cur; }).length;
      html += '<tr class="grp cl-grp" data-s="' + cur + '"><td colspan="7">' + cur + ' ' + n + '건' +
              (cur === 'BLOCKER' ? ' — 이대로 병합하면 안 되는 것. 여기부터 보세요' : '') + '</td></tr>';
    }
    var d = decOf(f.id);
    html += '<tr data-jump="f-' + esc(f.id) + '" data-fid="' + esc(f.id) + '"' +
      ' data-p="' + esc(f.perspective) + '" data-s="' + esc(f.severity) + '" class="cl-row">' +
      '<td class="nw"><span class="dec ' + d + '">' + (LABEL[d] || '미결정') + '</span></td>' +
      '<td class="nw"><span class="sev ' + f.severity + '">' + f.severity + '</span></td>' +
      '<td class="nw"><span class="persp">' + (PERSP[f.perspective]||f.perspective) + '</span></td>' +
      '<td class="nw"><span class="fid">' + esc(f.id) + '</span></td>' +
      '<td class="t">' + esc(f.title) +
        (f.verdict === 'NEEDS-INFO' ? ' <span class="needsinfo">확인 필요</span>' : '') +
        '<div class="loc" style="margin-top:2px">근거 ' + esc(f.basis) + '</div></td>' +
      '<td class="nw loc">' + esc(f.file.split('/').pop()) + ':' + esc(f.line) + '</td>' +
      '<td class="nw"><a href="#unit-' + esc(f.unitId) + '">' + esc(f.unitId) + '</a></td></tr>';
  });
  t.innerHTML = html;
  t.querySelectorAll('tr[data-jump]').forEach(function(tr){
    tr.addEventListener('click', function(e){
      if (e.target.tagName === 'A') return;
      jump(tr.dataset.jump);
    });
  });
})();

/* ── 코드 렌더 ───────────────────────────────── */
/* 보기 방식 — 통합(위아래) / 나란히(좌우). 사람마다 취향이 갈려 토글로 둡니다. */
var DIFF_KEY = 'oi-review-diffmode';
var diffMode = 'unified';
try { if (localStorage.getItem(DIFF_KEY) === 'split') diffMode = 'split'; } catch(e){}

function codeUnified(rows, hits, lang){
  var st = newState();
  return '<table>' + rows.map(function(r){
    var cls = r.type === 'add' ? 'add' : (r.type === 'del' ? 'del' : '');
    if (r.afterNo && hits[r.afterNo]) cls += ' hit';
    var no = r.type === 'del' ? '-' + (r.beforeNo || '') : (r.afterNo || '');
    var sign = r.type === 'add' ? '+' : (r.type === 'del' ? '-' : ' ');
    return '<tr class="' + cls + '"><td class="ln">' + no + '</td><td>' +
           esc(sign + ' ') + hlLine(r.text, st, lang) + '</td></tr>';
  }).join('') + '</table>';
}

/** 삭제 묶음과 추가 묶음을 짝지어 좌우로 세웁니다. */
function pairRows(rows){
  var out = [], i = 0;
  while (i < rows.length) {
    if (rows[i].type === 'ctx') { out.push({l: rows[i], r: rows[i]}); i++; continue; }
    var dels = [], adds = [];
    while (i < rows.length && rows[i].type === 'del') dels.push(rows[i++]);
    while (i < rows.length && rows[i].type === 'add') adds.push(rows[i++]);
    if (!dels.length && !adds.length) { i++; continue; }   // 방어
    for (var k = 0; k < Math.max(dels.length, adds.length); k++)
      out.push({l: dels[k] || null, r: adds[k] || null});
  }
  return out;
}

function codeSplit(rows, hits, lang){
  var ls = newState(), rs = newState();
  return '<table class="split">' + pairRows(rows).map(function(pr){
    var l = pr.l, r = pr.r;
    var cls = (r && hits[r.afterNo]) ? ' class="hit"' : '';
    var lCls = !l ? 'c gap' : (l.type === 'del' ? 'c del' : 'c');
    var rCls = !r ? 'c gap' : (r.type === 'add' ? 'c add' : 'c');
    return '<tr' + cls + '>' +
      '<td class="ln">' + (l ? (l.beforeNo || '') : '') + '</td>' +
      '<td class="' + lCls + '">' + (l ? hlLine(l.text, ls, lang) : '') + '</td>' +
      '<td class="ln">' + (r ? (r.afterNo || '') : '') + '</td>' +
      '<td class="' + rCls + '">' + (r ? hlLine(r.text, rs, lang) : '') + '</td></tr>';
  }).join('') + '</table>';
}

var codeBlocks = [];   // 토글 시 다시 그리기 위한 등록부

function codeTable(rows, hitLines, lang, alwaysUnified){
  if (!rows || !rows.length) return '';
  var hits = {}; (hitLines||[]).forEach(function(n){ hits[n]=1; });
  var mode = alwaysUnified ? 'unified' : diffMode;
  var html = mode === 'split' ? codeSplit(rows, hits, lang) : codeUnified(rows, hits, lang);
  return '<div class="code" data-cb="' + (alwaysUnified ? 'fixed' : codeBlocks.length) + '">' + html + '</div>';
}

function renderCode(rows, hits, lang){
  var idx = codeBlocks.length;
  var html = codeTable(rows, hits, lang);
  codeBlocks.push({rows: rows, hits: hits, lang: lang, idx: idx});
  return html;
}

function redrawCode(){
  codeBlocks.forEach(function(b){
    var el = document.querySelector('.code[data-cb="' + b.idx + '"]');
    if (!el) return;
    var hits = {}; (b.hits||[]).forEach(function(n){ hits[n]=1; });
    el.innerHTML = diffMode === 'split'
      ? codeSplit(b.rows, hits, b.lang)
      : codeUnified(b.rows, hits, b.lang);
  });
}
function foldedCode(rows, hits, lang, label, isSource){
  if (!rows || !rows.length) return null;
  var add = rows.filter(function(r){ return r.type==='add'; }).length;
  var del = rows.filter(function(r){ return r.type==='del'; }).length;
  var d = el('<details class="fold"><summary>' + esc(label) + ' · ' + rows.length + '줄 ' +
    (add ? '<span class="plus">+' + add + '</span> ' : '') +
    (del ? '<span class="minus">−' + del + '</span>' : '') + '</summary></details>');
  d.appendChild(el(isSource ? codeTable(rows, hits, lang, true) : renderCode(rows, hits, lang)));
  return d;
}

/* ── 지적 카드 ───────────────────────────────── */
function findingCard(f){
  var d = store[f.id] || {}, lang = f.lang || 'cs';
  var dl = '';
  function row(label, html){ dl += '<dt>' + label + '</dt><dd>' + html + '</dd>'; }
  row('문제', '<div class="prose">' + prose(f.problem) + '</div>');
  row('근거', '<b>' + esc(f.basis) + '</b>');
  if (f.before) row('변경 전', '<pre class="was">' + hlBlock(f.before, lang) + '</pre>');
  if (f.after)  row('변경 후', '<pre class="now">' + hlBlock(f.after, lang) + '</pre>');
  if (f.suggestion) row('개선', '<pre>' + hlBlock(f.suggestion, lang) + '</pre>');
  if (f.checkpoints) row('점검', '<div class="prose">' + prose(f.checkpoints) + '</div>');

  var opts = [['agree','합의'],['hold','보류'],['deny','반려']].map(function(o){
    return '<label class="' + o[0] + '"><input type="radio" name="dec-' + esc(f.id) + '" value="' +
      o[0] + '"' + (d.decision === o[0] ? ' checked' : '') + '><span>' + o[1] + '</span></label>';
  }).join('');

  var card = el(
    '<article class="finding ' + f.severity + '" id="f-' + esc(f.id) + '"' +
      ' data-p="' + esc(f.perspective) + '" data-s="' + esc(f.severity) + '" data-fid="' + esc(f.id) + '">' +
      '<h4><span class="sev ' + f.severity + '">' + f.severity + '</span>' +
        '<span class="persp">' + (PERSP[f.perspective] || f.perspective) + '</span>' +
        '<span class="fid">' + esc(f.id) + '</span>' +
        (f.verdict === 'NEEDS-INFO' ? '<span class="needsinfo">확인 필요</span>' : '') +
        '<span>' + esc(f.title) + '</span>' +
        '<span class="loc">' + esc(f.file.split('/').pop()) + ':' + esc(f.line) + '</span>' +
        '<button class="seecode">코드 보기</button></h4>' +
      '<dl>' + dl + '</dl>' +
      '<div class="decide"><div class="opts">' + opts + '</div>' +
        '<textarea placeholder="회의 메모">' + esc(d.memo || '') + '</textarea></div>' +
    '</article>');

  card.querySelector('.seecode').addEventListener('click', function(){
    var fold = card.closest('.unit') && card.closest('.unit').querySelector('details.fold');
    if (!fold) return;
    fold.open = true;
    fold.scrollIntoView({behavior:'smooth', block:'center'});
  });
  card.querySelectorAll('input[type=radio]').forEach(function(r){
    r.addEventListener('change', function(){
      store[f.id] = store[f.id] || {}; store[f.id].decision = r.value;
      save(); refreshProgress(); syncChecklist(); applyFilters();
    });
  });
  card.querySelector('textarea').addEventListener('input', function(e){
    store[f.id] = store[f.id] || {}; store[f.id].memo = e.target.value; save();
  });
  return card;
}

/* ── 본문 ────────────────────────────────────── */
function cssId(p){ return p.replace(/[^A-Za-z0-9_-]/g, '_'); }
var main = document.getElementById('main'), toc = document.getElementById('toc');
var fByUnit = {};
D.findings.forEach(function(f){ (fByUnit[f.unitId] = fByUnit[f.unitId] || []).push(f); });
Object.keys(fByUnit).forEach(function(u){
  fByUnit[u].sort(function(a,b){ return order[a.severity] - order[b.severity]; });
});
var filesSorted = D.files.slice().sort(function(a,b){
  return (a.priority - b.priority) || a.path.localeCompare(b.path);
});

var tocHtml = '';
filesSorted.forEach(function(file){
  var units = D.units.filter(function(u){ return u.file === file.path; });
  var lang = file.lang || 'text';
  var sec = el('<section class="file" id="file-' + esc(cssId(file.path)) + '"></section>');
  sec.appendChild(el('<h2>' + esc(file.path) +
    '<span class="tag' + (file.priority === 1 ? ' p1' : '') + '">' + esc(file.kindLabel || file.changeType) + '</span>' +
    (file.renamedFrom ? '<span class="loc">← ' + esc(file.renamedFrom) + '</span>' : '') +
    (file.hasSql ? '<span class="tag">SQL</span>' : '') + '</h2>'));

  tocHtml += '<div class="f"><a href="#file-' + esc(cssId(file.path)) + '" style="border:0;padding-left:0">' +
             esc(file.path.split('/').pop()) + '</a></div>';

  if (!units.length) sec.appendChild(el('<div class="unit"><span class="empty">변경단위가 등록되지 않았습니다.</span></div>'));

  units.forEach(function(u){
    var fs = fByUnit[u.id] || [];
    var box = el('<div class="unit" id="unit-' + esc(u.id) + '" data-unit="' + esc(u.id) + '"></div>');
    var rng = u.afterLines ? ('after ' + u.afterLines[0] + '–' + u.afterLines[1])
            : (u.beforeLines ? ('before ' + u.beforeLines[0] + '–' + u.beforeLines[1]) : '');
    box.appendChild(el('<h3><span class="uid">' + esc(u.id) + '</span>' +
      '<span class="tag">' + esc(u.kindLabel || u.kind) + '</span>' +
      '<span class="sum">' + esc(u.summary) + '</span>' +
      '<span class="rng">' + esc(rng) + '</span></h3>'));
    var fold = foldedCode(u.rows, fs.map(function(f){ return f.line; }), u.lang || lang, '변경 코드 보기');
    if (fold) box.appendChild(fold);
    fs.forEach(function(f){ box.appendChild(findingCard(f)); });
    if (!fs.length) box.appendChild(el('<div class="empty">이 변경단위에 대한 지적 없음</div>'));
    sec.appendChild(box);

    tocHtml += '<a href="#unit-' + esc(u.id) + '"><span class="uid">' + esc(u.id) + '</span> ' +
               esc(u.summary) + (fs.length ? ' (' + fs.length + ')' : '') + '</a>';
  });

  if (file.lines && file.lines.length) {
    var wrap = el('<div style="padding:0 16px 14px"></div>');
    var srcFold = foldedCode(file.lines, [], lang, '파일 원문 보기 — ' + file.path, true);
    if (srcFold) { wrap.appendChild(srcFold); sec.appendChild(wrap); }
  }
  main.appendChild(sec);
});

/* SQL */
if (D.sql.length) {
  var q = el('<section class="file" id="sec-sql"><h2>SQL 본문과 튜닝포인트</h2></section>');
  var qb = el('<div class="unit"></div>');
  D.sql.forEach(function(s){
    qb.appendChild(el('<div class="sqlbox"><h4><span class="fid">' + esc(s.id) + '</span>' +
      '<span class="tag">' + esc(s.callType) + '</span>' +
      '<span>' + esc(s.sqlId || '(인라인)') + '</span>' +
      (s.unitId ? '<span class="loc">' + esc(s.unitId) + '</span>' : '') + '</h4>' +
      (s.sourcePath ? '<div class="path">' + esc(s.sourcePath) + '</div>' : '') +
      '<pre>' + hlBlock(s.body, 'sql') + '</pre>' +
      (s.tuningPoints && s.tuningPoints.length
        ? '<b style="font-size:12px">튜닝포인트</b><ul>' +
          s.tuningPoints.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'
        : '<div class="empty">튜닝포인트 없음</div>') + '</div>'));
  });
  q.appendChild(qb); main.appendChild(q);
  tocHtml += '<div class="f"><a href="#sec-sql" style="border:0;padding-left:0">SQL 본문</a></div>';
}

/* 반려 · 미확인 */
if (D.rejected.length) {
  main.appendChild(el('<details class="audit"><summary>검증에서 반려된 지적 ' + D.rejected.length +
    '건 (본문에 싣지 않음)</summary><table class="mini"><tr><th>ID</th><th>관점</th><th>지적</th><th>반려 사유</th></tr>' +
    D.rejected.map(function(r){
      return '<tr><td>' + esc(r.id) + '</td><td>' + esc(PERSP[r.perspective] || r.perspective) +
             '</td><td>' + esc(r.title) + '</td><td>' + esc(r.reason) + '</td></tr>';
    }).join('') + '</table></details>'));
}
if (D.unknowns.length) {
  main.appendChild(el('<details class="audit" open><summary>확인 못 한 것 ' + D.unknowns.length +
    '건</summary><ul>' + D.unknowns.map(function(u){ return '<li>' + esc(u) + '</li>'; }).join('') +
    '</ul></details>'));
}
toc.innerHTML = tocHtml || '<div class="empty">변경 없음</div>';

/* ── 검색 ────────────────────────────────────── */
var Q = '';
document.getElementById('q').addEventListener('input', function(e){
  Q = e.target.value.trim().toLowerCase(); applyFilters();
});
function visible(f){
  return !Q || (f.id + ' ' + f.title + ' ' + f.problem + ' ' + f.basis + ' ' + f.file)
    .toLowerCase().indexOf(Q) >= 0;
}
function applyFilters(){
  var shown = {};
  D.findings.forEach(function(f){ shown[f.id] = visible(f); });
  document.querySelectorAll('.finding').forEach(function(c){
    c.style.display = shown[c.dataset.fid] ? '' : 'none';
  });
  document.querySelectorAll('tr.cl-row').forEach(function(tr){
    tr.style.display = shown[tr.dataset.fid] ? '' : 'none';
  });
  document.querySelectorAll('tr.cl-grp').forEach(function(tr){
    var any = D.findings.some(function(f){ return f.severity === tr.dataset.s && shown[f.id]; });
    tr.style.display = any ? '' : 'none';
  });
  document.querySelectorAll('.unit').forEach(function(u){
    var all = u.querySelectorAll('.finding'), vis = 0;
    all.forEach(function(c){ if (c.style.display !== 'none') vis++; });
    u.style.opacity = (all.length > 0 && vis === 0) ? .38 : 1;
  });
  var n = D.findings.filter(function(f){ return shown[f.id]; }).length;
  document.getElementById('cl-note').textContent =
    Q ? ('검색 «' + Q + '» — ' + n + ' / ' + D.findings.length + '건 표시') : '';
}

/* ── 진행 표시 · 체크리스트 동기화 ───────────── */
function refreshProgress(){
  var n = {agree:0, hold:0, deny:0};
  D.findings.forEach(function(f){ var d = decOf(f.id); if (n[d] !== undefined) n[d]++; });
  var done = n.agree + n.hold + n.deny;
  document.getElementById('p-done').textContent  = done;
  document.getElementById('p-total').textContent = D.findings.length;
  document.getElementById('p-agree').textContent = n.agree;
  document.getElementById('p-hold').textContent  = n.hold;
  document.getElementById('p-deny').textContent  = n.deny;
}
function syncChecklist(){
  document.querySelectorAll('tr.cl-row').forEach(function(tr){
    var d = decOf(tr.dataset.fid), badge = tr.querySelector('.dec');
    badge.className = 'dec ' + d; badge.textContent = LABEL[d] || '미결정';
  });
}
refreshProgress(); syncChecklist();

/* ── 내보내기 ────────────────────────────────── */
function decisionsMd(){
  var lines = ['# 코드리뷰 회의 결과 — ' + (m.prNumber ? '#' + m.prNumber + ' ' : '') + (m.title || ''), ''];
  lines.push('- 대상: ' + (m.baseRef || '') + ' ← ' + (m.headRef || ''));
  lines.push('- 리뷰 판정: ' + (m.verdict || '-'));
  lines.push('- 작성: ' + new Date().toLocaleString('ko-KR'));
  lines.push('', '| ID | 관점 | 심각도 | 위치 | 지적 | 결정 | 메모 |', '|---|---|---|---|---|---|---|');
  sorted.forEach(function(f){
    var d = store[f.id] || {};
    lines.push('| ' + f.id + ' | ' + (PERSP[f.perspective] || f.perspective) + ' | ' + f.severity +
      ' | ' + f.file.split('/').pop() + ':' + f.line + ' | ' + String(f.title).replace(/\|/g, '\\|') +
      ' | ' + (LABEL[d.decision] || '미결정') + ' | ' + String(d.memo || '').replace(/\|/g, '\\|').replace(/\n/g, ' ') + ' |');
  });
  var open = sorted.filter(function(f){ return !decOf(f.id); });
  if (open.length) {
    lines.push('', '## 미결정 ' + open.length + '건', '');
    open.forEach(function(f){ lines.push('- ' + f.id + ' · ' + f.severity + ' · ' + f.title); });
  }
  return lines.join('\n');
}
function download(name, text, mime){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
document.getElementById('b-md').addEventListener('click', function(){
  var btn = this, md = decisionsMd();
  var done = function(ok){
    btn.textContent = ok ? '복사했습니다' : '복사 실패 — 파일로 저장했습니다';
    if (!ok) download('review-' + (m.prNumber || 'x') + '-decisions.md', md, 'text/markdown');
    setTimeout(function(){ btn.textContent = '회의 결과 마크다운 복사'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(function(){ done(true); }, function(){ done(false); });
  } else { done(false); }
});
document.getElementById('b-json').addEventListener('click', function(){
  download('review-' + (m.prNumber || 'x') + '-decisions.json',
    JSON.stringify({meta: m, decisions: store}, null, 2), 'application/json');
});
document.getElementById('b-open').addEventListener('click', function(){
  var any = Array.prototype.some.call(document.querySelectorAll('details'), function(d){ return !d.open; });
  document.querySelectorAll('details').forEach(function(d){ d.open = any; });
  this.textContent = any ? '코드 전부 접기' : '코드 전부 펼치기';
});
/* ── diff 보기 전환 (위아래 ↔ 좌우) ──────────── */
(function(){
  var btn = document.getElementById('b-diff');
  function paint(){
    btn.textContent = '보기: ' + (diffMode === 'split' ? '좌우' : '위아래');
    try { localStorage.setItem(DIFF_KEY, diffMode); } catch(e){}
  }
  btn.addEventListener('click', function(){
    diffMode = diffMode === 'split' ? 'unified' : 'split';
    paint(); redrawCode();
  });
  paint();
})();

/* ── 테마 전환 (시스템 → 라이트 → 다크) ──────── */
(function(){
  var btn = document.getElementById('b-theme');
  var TK = 'oi-review-theme';
  var CYCLE = ['system','light','dark'];
  var NAME = {system:'시스템', light:'라이트', dark:'다크'};
  var cur = 'system';
  try {
    var saved = localStorage.getItem(TK);
    if (saved === 'light' || saved === 'dark') cur = saved;
  } catch(e){}

  function paint(){
    if (cur === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', cur);
    btn.textContent = '테마: ' + NAME[cur];
    try { cur === 'system' ? localStorage.removeItem(TK) : localStorage.setItem(TK, cur); } catch(e){}
  }
  btn.addEventListener('click', function(){
    cur = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
    paint();
  });
  paint();
})();

document.getElementById('b-reset').addEventListener('click', function(){
  if (!confirm('이 PR 의 회의 결정과 메모를 모두 지웁니다. 계속할까요?')) return;
  store = {}; save(); location.reload();
});

applyFilters();
})();
